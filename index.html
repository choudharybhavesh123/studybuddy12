<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>updated: study smarter</title>
<meta name="theme-color" content="#0A0B12">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0A0B12;--panel:#10121C;--card:#161927;--line:#272B42;--ink:#F2F3FA;--muted:#9499B8;--v:#7C6CFF;--a:#FFB020;--font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 45% at 50% -5%,#5B4BFF66,transparent 70%),radial-gradient(40% 30% at 85% 0,#1E63FF44,transparent 70%)}
.app{position:relative;display:grid;grid-template-columns:270px 1fr;min-height:100vh;min-height:100dvh}
#side{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;height:100vh;height:100dvh;align-self:start}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em;padding:2px 8px 8px;display:flex;align-items:center;gap:8px}
.brand i{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE28A,var(--a) 55%,var(--v))}
.btn{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left}
.btn:hover{border-color:var(--v)}
#hist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.hl{color:var(--muted);font-size:13px;padding:8px 8px 2px}
.hi{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:0;border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi:hover{background:var(--card)}
.main{display:flex;flex-direction:column;min-width:0;min-height:100vh;min-height:100dvh}
#menu{display:none;position:fixed;top:10px;left:10px;z-index:15}
#stage{flex:1;padding:0 18px 12px}
#dockSlot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%)}
.col{max-width:760px;margin:0 auto}
#empty{padding-top:9vh;text-align:center}
.orb{width:96px;height:96px;margin:0 auto 22px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff9,transparent 38%),radial-gradient(circle,#FFD65A 0,#FF9F1C 42%,#6A3FFF 100%);box-shadow:0 0 0 7px #ffffff10,0 0 70px #7C6CFF99,0 0 130px #FFB02033;animation:b 5s ease-in-out infinite}
@keyframes b{50%{transform:scale(1.06)}}
h1{font-size:clamp(30px,5vw,50px);line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:0 0 10px}
.intro{color:var(--muted);margin:0 auto 26px;max-width:560px}
#dock{max-width:760px;margin:0 auto;width:100%;text-align:left}
.comp{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:12px 12px 10px}
.comp:focus-within{border-color:var(--v)}
#q{width:100%;background:transparent;border:0;color:var(--ink);font:inherit;resize:none;outline:none;max-height:160px;padding:4px 6px}
.crow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.lab{color:var(--muted);font-size:14px;margin-right:2px}
.chip{font:inherit;font-size:14px;border:1.2px solid var(--line);background:transparent;color:var(--ink);padding:4px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:#7C6CFF33;border-color:var(--v);font-weight:600}
#interest{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1.2px dashed var(--line);border-radius:999px;padding:4px 11px;width:150px}
#send{margin-left:auto;width:42px;height:42px;border-radius:50%;border:0;background:var(--a);color:#1a1200;font-size:20px;font-weight:800;cursor:pointer}
#send:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--v);outline-offset:2px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.card{font:inherit;color:var(--ink);text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px)}
.card b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em}
.card span{color:var(--muted);font-size:15px;line-height:1.35;display:block;margin-top:2px}
.c1:hover{border-color:var(--a)}.c1 b{color:var(--a)}
.c2:hover{border-color:var(--v)}.c2 b{color:#A79CFF}
.chat #dock{padding:8px 18px 14px}
.chat .cards{display:none}
.chat .intro-only{display:none}
.u{display:flex;gap:10px;margin:22px 0 10px;align-items:flex-start}
.av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--v);display:grid;place-items:center;font-size:14px;font-weight:800}
.av.b{background:radial-gradient(circle at 35% 30%,#FFE28A,var(--a) 60%,var(--v))}
.u p{margin:3px 0 0;font-weight:600}
.answer{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 20px 18px;margin-bottom:8px}
.answer h2{font-size:21px;margin:22px 0 6px;font-weight:800}
.answer p{margin:8px 0}.answer ul{padding-left:20px;margin:6px 0}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;min-width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#7C6CFF22}
.tag{font-weight:800;border-radius:8px;padding:2px 9px;font-size:14px;white-space:nowrap}
.t-must{background:#FF5A3633;color:#FF9C85}.t-should{background:#FFB02033;color:#FFD27A}.t-skip{background:#ffffff14;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.tools{display:flex;gap:8px;margin-top:14px}
.tools button{font:inherit;font-size:14px;border:1.2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:6px 11px;cursor:pointer}
.muted{color:var(--muted)}.err{color:#FF8A8F;font-weight:600}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--a);margin-right:8px;animation:b 1s ease-in-out infinite}
.note{color:var(--muted);font-size:13px;text-align:center;margin:8px 0 0}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:22px;width:min(480px,92vw);max-height:90vh}
dialog::backdrop{background:#000b}
dialog h2{margin:0 0 4px;font-size:25px;font-weight:800;letter-spacing:-.02em}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tb{font:inherit;font-size:18px;border:1.2px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;cursor:pointer;color:var(--ink)}
#lang{width:auto;padding:4px 8px;font-size:14px;border-radius:999px;border-width:1.2px}
.pvi{position:relative;display:inline-block;margin:2px 6px 8px}
.pvi img{max-height:90px;border-radius:12px;display:block}
.pvi button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--a);color:#1a1200;font-weight:800;cursor:pointer}
.uimg{max-height:130px;max-width:100%;border-radius:12px;margin-top:8px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.acts{display:flex;gap:8px;margin-top:18px}
.acts .go{flex:1;font:inherit;font-weight:800;font-size:17px;border:0;border-radius:13px;padding:13px;background:var(--a);color:#1a1200;cursor:pointer}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 #side{position:fixed;inset:0 auto 0 0;width:280px;z-index:20;transform:translateX(-102%);transition:transform .2s}
 #side.open{transform:none}
 #menu{display:block}.cards{grid-template-columns:1fr}#empty{padding-top:3vh}#stage{padding-top:54px}
}
@media (prefers-reduced-motion:reduce){.orb,.pulse{animation:none}#side,.card{transition:none}}
@media print{body{background:#fff;color:#000}body::before,#side,header,#dock,.tools,.note{display:none}.app,.main,#stage{display:block;height:auto;min-height:0}.answer{border:0;background:#fff;color:#000}th,td{border-color:#999}}
[hidden]{display:none!important}
</style>
</head>
<body>

  <button class="btn" id="menu" aria-label="Open menu">☰</button>
  <aside id="side">
    <div class="brand"><i></i>updated</div>
    <button class="btn" id="newChat">+ New chat</button>

          </div>
        </div>
        <div id="thread"></div>
      </div>
    </div>
